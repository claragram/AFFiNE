name: claranote

services:
  gateway:
    image: caddy:alpine
    container_name: claranote_gateway
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - claranote
    restart: unless-stopped

  claranote:
    build:
      context: .
      dockerfile: Dockerfile
    image: claranote:latest
    container_name: claranote_server
    ports:
      - '3010:3010'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      claranote_migration:
        condition: service_completed_successfully
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine:affine_secure_pass@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
      - AFFINE_CONFIG_PATH=/root/.affine/config
    restart: unless-stopped

  claranote_migration:
    image: claranote:latest
    container_name: claranote_migration_job
    volumes:
      - ./data/storage:/root/.affine/storage
      - ./config:/root/.affine/config
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://affine:affine_secure_pass@postgres:5432/affine
      - DEPLOYMENT_TYPE=selfhosted
      - AFFINE_CONFIG_PATH=/root/.affine/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: claranote_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: claranote_postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: affine
      POSTGRES_PASSWORD: affine_secure_pass
      POSTGRES_DB: affine
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'affine', '-d', 'affine']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
